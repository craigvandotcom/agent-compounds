schema_version: 1
id: neometa.stashguard
name: neoMeta shared-checkout safety
version: 1.1.0
destructive_patterns:
  - name: unscoped-stash-save
    pattern: 'git\s+(?:-\S+\s+)*stash'
    severity: high
    description: "Unscoped git stash sweeps EVERY agent's uncommitted work in this shared checkout. The stash stack is repo-global and shared across all worktrees. Scope it instead: git stash push -- your/paths. Better still, commit: under trunk-direct that is free, and holding uncommitted work is the root cause."
  - name: whole-tree-add
    pattern: 'git\s+(?:(?:-C|--git-dir|--work-tree)\s+\S+\s+|-\S+\s+)*add\s+(?:-\S+\s+)*(?:-A|--all|-u|--update|\.)(?:\s|$)'
    severity: high
    description: "THE STAGING AREA IS SHARED STATE — it is per-worktree, not per-agent, so add-then-commit is not atomic across agents. A whole-tree add sweeps in whatever a concurrent agent has already staged and commits it under YOUR bead's message (measured: commit 40eb9177 carries three bd-gcrhc files under a bd-jk3j6 message). Nothing fails; the damage is to the record — blame, bisect, review-by-range and revert-a-bead all misattribute. Skip the index entirely: git commit -- path/one path/two. Scoping only the add is NOT enough, because a bare commit publishes the whole index (proof: tools/dcg/shared-checkout-steal-probe.sh Case 2). Deliberate whole-tree intent remains available as git add -A -- . — the guard makes the sweep explicit, not impossible."
safe_patterns:
  - name: scoped-stash-push
    pattern: 'git\s+(?:-\S+\s+)*stash\s+push\b[^|;&]*\s--\s+\S'
    description: "A pathspec after -- means the caller named their own files"
  - name: stash-read-and-restore
    pattern: 'git\s+(?:-\S+\s+)*stash\s+(?:list|show|pop|apply|branch)\b'
    description: "Listing, inspecting and restoring a stash harms no other agent. drop and clear are deliberately absent: dcg core already guards those."
  - name: scoped-add
    pattern: 'git\s+(?:-\S+\s+)*add\b[^|;&]*\s--\s+\S'
    description: "A pathspec after -- means the caller named what they are staging — including the deliberate whole-tree form, git add -A -- . — so a solo agent in a non-shared repo is never blocked from staging its own full tree."
