name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "skills/expert-consensus/pyproject.toml"
      - "ruff.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "skills/expert-consensus/pyproject.toml"
      - "ruff.toml"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check skills/expert-consensus/ skills/ac-review/scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openai
      - run: python skills/expert-consensus/tests/test_openrouter.py
