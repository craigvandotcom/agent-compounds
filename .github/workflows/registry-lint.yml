name: Registry Lint

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "hooks/**"
      - "scripts/**"
      - "lint.sh"
      - ".github/workflows/**"
      # .beads/** is the EXPIRY TRIGGER for Check 21's PENDING-DECISION escapes: closing a
      # cited decision bead must re-run the check, or an expired escape rots silently until
      # some unrelated push happens to notice (ac-on0y.4).
      - ".beads/**"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "hooks/**"
      - "scripts/**"
      - "lint.sh"
      - ".github/workflows/**"
      # .beads/** is the EXPIRY TRIGGER for Check 21's PENDING-DECISION escapes: closing a
      # cited decision bead must re-run the check, or an expired escape rots silently until
      # some unrelated push happens to notice (ac-on0y.4).
      - ".beads/**"

jobs:
  registry-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash lint.sh

  # Executes every committed proof-test harness (ac-on0y.1). Before this job existed,
  # 15 harnesses were green-capable and NOT ONE ever ran — two of them had been silently
  # red for an unknown period. A proof test that never runs is documentation.
  #
  # Its OWN job with its OWN checkout on purpose: ac-q1mu edits the registry-lint job's
  # checkout step, so keeping these separate narrows the overlap to the file, not the
  # job body. fetch-depth: 0 because lint-net-growth.test.sh resolves origin/HEAD and a
  # depth-1 checkout collapses origin/main onto HEAD (the ac-q1mu lesson).
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # element4-check.test.sh proves stamp-refined.sh's contract under BOTH shells,
      # because the agents that call it run zsh. ubuntu-latest ships no zsh, and the
      # harness correctly REFUSES to pass on a host where it cannot prove that half
      # (found on this job's first real run). AC4 offers provision-or-loud-skip; we
      # provision, because skipping would quietly halve what the harness certifies.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh ripgrep
      - run: bash scripts/run-all-harnesses.sh
