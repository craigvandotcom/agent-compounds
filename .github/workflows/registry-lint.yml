name: Registry Lint

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "hooks/**"
      - "lint.sh"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "hooks/**"
      - "lint.sh"
      - ".github/workflows/**"

jobs:
  registry-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash lint.sh
