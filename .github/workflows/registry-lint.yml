name: Registry Lint

on:
  # No path filter: the suite is seconds long, and a filter list rots as files move.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Style + secrets + the registry's own check suite.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: lint.sh's Check 14 diffs against origin/main, which a shallow
        # checkout collapses onto HEAD (a silent self-pass). lint.sh FAILS LOUDLY if the
        # base still collapses, so a regression here cannot hide.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash lint.sh
        # Checks 25/29/31's growth ratchet (lint/lib/ratchet.py's base_ref()) reads this: the
        # pre-push sha on a push, the PR's base sha on a pull_request — what was actually on
        # the branch before, never a moving origin/main a squash or force-push can shift out
        # from under a commit still in flight.
        env:
          LINT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  # Executes every committed proof-test harness (glob-discovered by run-all-proofs.sh). A
  # proof test that never runs is documentation. Its OWN job with its OWN checkout, so
  # editing this job's steps never touches the lint job's.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ubuntu-latest ships no zsh; some harnesses prove their target under both shells
      # because the agents that call it run zsh.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh ripgrep
      - run: bash scripts/run-all-proofs.sh
